aid: beaubble
name: Beaubble
description: 'Beaubble is a community-driven beauty commerce platform that lets creators
  launch their own customized, premium beauty brands and products by engaging their
  audiences. The company runs a direct-to-consumer storefront at beaubble.com featuring
  creator-led lines from talent such as Teni Panosian, Elsa Hosk, Shanina Shaik, Abbie
  Herbert, Rudi Berry, and Avrey Ovard, selling items like lip stains, freckle pens,
  and curated bundles. Backed by 500 Global, Beaubble is a consumer e-commerce brand
  with no public developer API surface; this profile was created by the API Evangelist
  enrichment pipeline and captures the company''s public web presence and domain-security
  posture.'
